name: Bug Report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a bug!"

  - type: input
    id: card_version
    attributes:
      label: Card version
      description: Found via HACS → VAB Departures Card, or in `vab-departures-card.js` header
      placeholder: "e.g. 1.10.6"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: ha-vab-integration version
      placeholder: "e.g. 2.0.2"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. See error
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: "Open DevTools (F12) → Console, paste any errors related to vab-departures-card."
      render: text
